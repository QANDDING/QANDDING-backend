spring:
  application:
    name: qandding-backend
  datasource:
    url: jdbc:mysql://localhost:3306/qandding?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile
            redirect-uri: '{baseUrl}/login/oauth2/code/{registrationId}'
        provider:
          google:
            issuer-uri: https://accounts.google.com

server:
  port: 8080

app:
  oauth:
    allowed-domain: ${APP_OAUTH_ALLOWED_DOMAIN}
    redirect-url: ${APP_OAUTH_REDIRECT_URL}

  s3:
    bucket: ${APP_S3_BUCKET}
    region: ${APP_S3_REGION}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    url-expire-seconds: ${APP_S3_URL_EXPIRE_SECONDS}
    upload-prefix: ${APP_S3_UPLOAD_PREFIX}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
    allowed-methods: ${APP_CORS_ALLOWED_METHODS}
    allowed-headers: ${APP_CORS_ALLOWED_HEADERS}
    exposed-headers: ${APP_CORS_EXPOSED_HEADERS}
    allow-credentials: ${APP_CORS_ALLOW_CREDENTIALS}
    max-age-seconds: ${APP_CORS_MAX_AGE_SECONDS}

  ratelimit:
    enabled: ${APP_RATELIMIT_ENABLED}
    requests: ${APP_RATELIMIT_REQUESTS}
    seconds: ${APP_RATELIMIT_SECONDS}
  gemini:
    api-key: ${APP_GEMINI_API_KEY}
    model: ${APP_GEMINI_MODEL}
  huggingface:
    api-key: ${HUGGINGFACE_API_KEY}
    model: Salesforce/blip-image-captioning-large

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://mysql:3306/qandding?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true

logging:
  level:
    root: INFO
    org.hibernate.SQL: warn
    com.qandding: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.orm.jpa: DEBUG
    org.hibernate: DEBUG
    org.springframework.web.servlet.mvc.method.annotation: TRACE
    org.springframework.web.servlet.DispatcherServlet: TRACE
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
