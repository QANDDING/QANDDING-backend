version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: qandding-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pw
      MYSQL_DATABASE: qandding
      MYSQL_USER: qandding
      MYSQL_PASSWORD: qandding_pw
      TZ: Asia/Seoul
    ports:
      - '3307:3306'
    volumes:
      - db_data:/var/lib/mysql
    command: ['--default-authentication-plugin=mysql_native_password']
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root', '-proot_pw']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 서비스 제거 - 토큰을 DB에서 관리

  app:
    build: .
    container_name: qandding-app
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/qandding
      - DB_USERNAME=qandding
      - DB_PASSWORD=qandding_pw
      # Redis 환경변수 제거 - 토큰을 DB에서 관리
      - APP_JWT_SECRET=docker_jwt_secret_key_2024
      - APP_JWT_ACCESS_EXPIRATION=900000
      - APP_JWT_REFRESH_EXPIRATION=604800000
    depends_on:
      mysql:
        condition: service_healthy
      # Redis 의존성 제거 - 토큰을 DB에서 관리

volumes:
  db_data:
  # Redis 볼륨 제거 - 토큰을 DB에서 관리
